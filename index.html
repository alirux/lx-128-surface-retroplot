<!doctype html>
<html lang="en" data-theme="c128">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lirux 3D</title>
  <meta name="description" content="A 3D function plotter in the style of an 80s home computer.">
  <link rel="preload" href="fonts/press-start-2p-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="rig">
    <section class="monitor" aria-label="Monitor">
      <header class="bezel-top">
        <span class="badge">LIRUX<b>3D</b></span>
        <span class="model">MODEL LX-128 &middot; 40/80 COLUMN VIDEO DISPLAY</span>
      </header>

      <div class="screen" id="screen">
        <canvas class="tape" id="tape" width="1" height="120" aria-hidden="true"></canvas>
        <div class="display" id="display">
          <div class="plotwrap" id="plotwrap">
            <canvas id="plot" tabindex="0" aria-label="3D plot. Drag to rotate, wheel to zoom, arrow keys when focused."></canvas>
          </div>
          <div class="status" id="status"><span class="l"></span><span class="r"></span></div>
          <div class="term" id="term">
            <div class="out" id="out" aria-live="polite"></div>
            <label class="inputline">
              <span class="mirror" id="mirror"></span>
              <input id="cmd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Command or formula">
            </label>
          </div>
        </div>
        <div class="glass" aria-hidden="true"></div>
      </div>

      <footer class="bezel-bottom">
        <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <span class="series">LX&middot;128</span>
        <div class="knobs" aria-hidden="true">
          <span class="knob"><i></i><em>BRIGHT</em></span>
          <span class="knob"><i></i><em>CONTRAST</em></span>
        </div>
        <span class="power"><span class="led"></span>POWER</span>
      </footer>
    </section>

    <nav class="keys" id="keys" aria-label="Function keys"></nav>
    <p class="hint">DRAG TO ROTATE &middot; WHEEL TO ZOOM &middot; TYPE <kbd>HELP</kbd> AND PRESS <kbd>RETURN</kbd></p>

    <footer class="credits">
      <span>&copy; 2026 ALBERTO "LIRUX" LIRUSSI</span>
      <a href="privacy.html">PRIVACY</a>
      <a href="https://github.com/alirux" target="_blank" rel="noopener noreferrer">GITHUB</a>
      <a href="https://www.linkedin.com/in/alberto-lirussi/" target="_blank" rel="noopener noreferrer">LINKEDIN</a>
    </footer>
  </main>

  <script src="js/parser.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
